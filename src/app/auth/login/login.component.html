<ion-content class="ion-padding">

  <h2>Grow Sync Login</h2>

  <ion-item>
    <ion-label position="stacked">Email</ion-label>
    <ion-input
      type="email"
      [(ngModel)]="email"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Password</ion-label>
    <ion-input
      type="password"
      [(ngModel)]="password"
    ></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="login()">
    Login
  </ion-button>

</ion-content>
